<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой ИИ-репетитор</title><style>:root{font-family:system-ui,-apple-system,Arial;background:#f5f6fb;color:#20243a}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:12px 0}h2{font-size:20px}.muted{color:#667085}.card{background:white;border:1px solid #e5e8f0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.tabs,.row{display:flex;gap:9px;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #d9ddeb;border-radius:12px;padding:11px;background:white;color:#20243a}button{cursor:pointer}button.primary,.active{background:#525bd6;color:white;border-color:#525bd6}button:disabled{opacity:.5}input,textarea,select{max-width:100%;width:100%}label{display:block;margin:10px 0 5px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:15px;border-radius:14px;background:#f4f5fc}.big{font-size:30px;font-weight:800}.hidden{display:none}.question{font-size:23px;font-weight:700;margin:18px 0}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#edf0ff;color:#414ab2;margin:3px;font-size:13px}.answer-correct{border:2px solid #20a464!important;background:#e8f8ef!important}.answer-wrong{border:2px solid #df4444!important;background:#fff0f0!important}.feedback.correct{background:#e8f8ef;color:#17683e}.feedback.wrong{background:#fff0f0;color:#a32929}.feedback{padding:12px;background:#f4f5fc;border-radius:12px;margin:12px 0;min-height:45px}.book{padding:10px 0;border-bottom:1px solid #eee}.small{font-size:13px}.profile{font-size:28px}nav{margin:18px 0}.warn{background:#fff5e6;padding:12px;border-radius:12px}@media(max-width:560px){.app{padding:12px}.card{padding:15px}button{padding:10px}h1{font-size:21px}}
select{background:white}.topicbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.topicbar button{font-size:14px}.notice{background:#eef4ff;border-radius:12px;padding:12px;margin:12px 0}.lesson{background:#f8f9ff;border-left:4px solid #525bd6;padding:14px;border-radius:10px;line-height:1.6}.hwitem{border-bottom:1px solid #e5e8f0;padding:12px 0}.ok{color:#17683e}.danger{color:#a32929}.full{width:100%}button.secondary{background:#edf0ff}.smallbtn{padding:6px 10px;font-size:13px}.book a{font-size:13px}.feedback{white-space:pre-line}</style></head><body><main class="app"><header><div><h1>📚 Мой ИИ-репетитор</h1><div class="muted small">Бесплатные занятия для Ники и Феди</div></div><span class="pill">Версия 3.0</span></header><nav class="tabs" id="profiles"></nav><div id="main"></div></main><script>
const catalog={"nika": [["Алгебра", "8 класс"], ["Геометрия", "7–9 классы (общий учебник)"], ["Русский язык", "8 класс"], ["Литература", "8 класс, обе части в одном PDF"], ["Английский язык", "Spotlight 8"], ["Физика", "8 класс, Перышкин, Иванов"], ["Химия", "8 класс"], ["Биология", "8 класс, Пасечник; доступен фрагмент PDF"], ["География", "8 класс, «Полярная звезда»"], ["Всеобщая история", "История Нового времени, 8 класс"]], "fedya": [["Алгебра", "7 класс"], ["Геометрия", "7–9 классы (общий учебник)"], ["Русский язык", "7 класс, части 1 и 2"], ["Литература", "7 класс, части 1 и 2"], ["Английский язык", "7 класс"], ["Биология", "7 класс, Пасечник"], ["История России", "7 класс"], ["Всеобщая история", "7 класс"], ["Вероятность и статистика", "7–9 классы, часть 1"], ["Физика", "7 класс, Перышкин, Иванов; доступен фрагмент PDF"], ["Физика: задачи", "Лукашик, 7–9 классы"], ["География", "7 класс, «Полярная звезда»"]]};
const students={nika:{name:'Ника',grade:'8 «Д»',icon:'👩🏻‍🎓'},fedya:{name:'Федя',grade:'7 «Д»',icon:'👨🏼‍🎓'}};
const bank={
nika:[
{subject:'Алгебра',topic:'Квадратные корни',lesson:'Арифметический квадратный корень из a — неотрицательное число, квадрат которого равен a. Например, √64 = 8.',q:'Чему равен √144?',a:['12'],hint:['Найди положительное число, квадрат которого равен 144.','12 × 12 = 144.'],explain:'√144 = 12, потому что 12² = 144.'},
{subject:'Алгебра',topic:'Линейные уравнения',lesson:'Чтобы решить уравнение, выполняй одинаковые действия с обеими частями. Сначала перенеси свободный член, затем раздели на коэффициент при x.',q:'Реши уравнение 5x − 7 = 18. Чему равен x?',a:['5'],hint:['Прибавь 7 к обеим частям.','5x = 25.'],explain:'5x = 25, поэтому x = 5.'},
{subject:'Алгебра',topic:'Степени',lesson:'При умножении степеней с одинаковым основанием показатели складываются: aᵐ · aⁿ = aᵐ⁺ⁿ.',q:'Чему равно 2³ · 2²?',a:['32'],hint:['Сложи показатели 3 и 2.','2⁵ = 32.'],explain:'2³ · 2² = 2⁵ = 32.'},
{subject:'Геометрия',topic:'Треугольники',lesson:'Сумма внутренних углов любого треугольника равна 180°.',q:'Два угла треугольника равны 45° и 65°. Найди третий угол (в градусах).',a:['70'],hint:['Вычти из 180° сумму двух известных углов.','45 + 65 = 110.'],explain:'180 − 45 − 65 = 70°.'},
{subject:'Русский язык',topic:'Грамматическая основа',lesson:'Грамматическую основу предложения образуют подлежащее и сказуемое (либо один главный член).',q:'Какой член предложения обозначает то, о ком или о чём говорится?',a:['подлежащее'],hint:['Он обычно отвечает на вопросы «кто?» или «что?».'],explain:'Подлежащее называет предмет речи.'},
{subject:'Физика',topic:'Давление',lesson:'Давление вычисляют по формуле p = F / S. Единица давления — паскаль (Па), то есть Н/м².',q:'Сила 120 Н действует на площадь 3 м². Найди давление в Па.',a:['40'],hint:['Подели силу на площадь.','120 : 3 = ?'],explain:'p = 120 / 3 = 40 Па.'},
{subject:'Физика',topic:'Количество теплоты',lesson:'При нагревании без фазового перехода количество теплоты Q = c · m · Δt.',q:'Какой буквой в формуле Q = c·m·Δt обозначена масса?',a:['m','м'],hint:['Вспомни стандартное обозначение массы в физике.'],explain:'Массу обозначают латинской буквой m.'},
{subject:'Химия',topic:'Химические элементы',lesson:'Химический элемент — вид атомов с одинаковым зарядом ядра. Символ кислорода — O, водорода — H.',q:'Как обозначают химический элемент кислород?',a:['o','о'],hint:['Это одна латинская буква.'],explain:'Символ кислорода — O.'},
{subject:'Биология',topic:'Клетка',lesson:'Клетка — структурная и функциональная единица живых организмов.',q:'Как называется основная структурная единица живого организма?',a:['клетка'],hint:['Из этих единиц состоят ткани.'],explain:'Основная единица живого — клетка.'},
{subject:'География',topic:'Географические координаты',lesson:'Географическая широта измеряется от экватора к полюсам, долгота — от нулевого меридиана к востоку или западу.',q:'От какой линии отсчитывают географическую широту?',a:['экватор','экватора'],hint:['Эта линия делит Землю на Северное и Южное полушария.'],explain:'Широту отсчитывают от экватора.'},
{subject:'Английский язык',topic:'Past Simple',lesson:'Past Simple обозначает завершённое действие в прошлом. У правильных глаголов обычно добавляют -ed.',q:'Напиши прошедшую форму глагола play.',a:['played'],hint:['Добавь окончание -ed.'],explain:'play → played.'},
{subject:'Всеобщая история',topic:'Исторические века',lesson:'XVIII век охватывает годы с 1701 по 1800 включительно.',q:'Какой век обозначают римскими цифрами XVIII? Ответь числом.',a:['18'],hint:['X = 10, V = 5, III = 3.'],explain:'XVIII = 10 + 5 + 3 = 18.'},
{subject:'Литература',topic:'Литературные термины',lesson:'Эпитет — образное определение, помогающее ярче представить предмет или явление.',q:'Как называется образное определение в художественном тексте?',a:['эпитет'],hint:['Например, «золотая осень».'],explain:'Это эпитет.'}
],
fedya:[
{subject:'Алгебра',topic:'Уравнения',lesson:'Чтобы найти неизвестное слагаемое, вычти известное слагаемое из суммы.',q:'Реши уравнение x + 9 = 24.',a:['15'],hint:['Вычти 9 из 24.'],explain:'x = 24 − 9 = 15.'},
{subject:'Алгебра',topic:'Линейные уравнения',lesson:'При переносе слагаемого через знак равенства его знак меняется.',q:'Реши 3x = 27. Чему равен x?',a:['9'],hint:['Раздели обе части на 3.'],explain:'x = 27 / 3 = 9.'},
{subject:'Геометрия',topic:'Смежные углы',lesson:'Смежные углы имеют одну общую сторону, а две другие стороны образуют прямую. Их сумма равна 180°.',q:'Один смежный угол равен 65°. Найди второй (в градусах).',a:['115'],hint:['Вычти 65 из 180.'],explain:'180 − 65 = 115°.'},
{subject:'Геометрия',topic:'Треугольники',lesson:'Сумма углов треугольника равна 180°.',q:'Два угла треугольника равны 50° и 60°. Найди третий.',a:['70'],hint:['180 − 50 − 60.'],explain:'Третий угол равен 70°.'},
{subject:'Русский язык',topic:'Наречие',lesson:'Наречие обозначает признак действия, признак признака или другого предмета и обычно не изменяется.',q:'Какая часть речи слово «быстро» в предложении «Он быстро бежал»?',a:['наречие'],hint:['Отвечает на вопрос «как?».'],explain:'«Быстро» — наречие.'},
{subject:'Русский язык',topic:'Причастие',lesson:'Причастие обозначает признак предмета по действию и отвечает на вопросы «какой?», «что делающий?» и подобные.',q:'Как называется особая форма глагола в сочетании «читающий мальчик»?',a:['причастие'],hint:['«Читающий» обозначает признак по действию.'],explain:'«Читающий» — причастие.'},
{subject:'Физика',topic:'Скорость',lesson:'При равномерном движении скорость v = s / t, где s — путь, t — время.',q:'Тело прошло 120 м за 20 с. Найди скорость в м/с.',a:['6'],hint:['Раздели 120 на 20.'],explain:'v = 120 / 20 = 6 м/с.'},
{subject:'Физика',topic:'Плотность',lesson:'Плотность ρ = m / V, где m — масса, V — объём.',q:'Масса тела 200 г, объём 50 см³. Найди плотность в г/см³.',a:['4'],hint:['200 : 50 = ?'],explain:'ρ = 200 / 50 = 4 г/см³.'},
{subject:'Биология',topic:'Организмы',lesson:'Биология изучает живые организмы и их взаимодействие с окружающей средой.',q:'Как называется наука о живых организмах?',a:['биология'],hint:['Название предмета, который ты сейчас изучаешь.'],explain:'Биология.'},
{subject:'География',topic:'Масштаб',lesson:'Масштаб показывает, во сколько раз расстояние на карте меньше реального.',q:'Масштаб карты 1:100 000. Скольким километрам на местности соответствует 1 см на карте?',a:['1'],hint:['100 000 см = 1 000 м.'],explain:'100 000 см = 1 км.'},
{subject:'Английский язык',topic:'Present Simple',lesson:'В Present Simple с he/she/it обычно добавляют -s к глаголу.',q:'Вставь слово: She ___ football every day. (play)',a:['plays'],hint:['Подлежащее she — третье лицо единственного числа.'],explain:'She plays football every day.'},
{subject:'История России',topic:'Исторические века',lesson:'XVI век — период с 1501 по 1600 год.',q:'Какой век обозначают римскими цифрами XVI? Ответь числом.',a:['16'],hint:['X = 10, V = 5, I = 1.'],explain:'XVI = 16.'},
{subject:'Всеобщая история',topic:'Исторические века',lesson:'XVII век — годы с 1601 по 1700 включительно.',q:'Какой век обозначают римскими цифрами XVII? Ответь числом.',a:['17'],hint:['X = 10, V = 5, II = 2.'],explain:'XVII = 17.'},
{subject:'Вероятность и статистика',topic:'Среднее арифметическое',lesson:'Среднее арифметическое — сумма чисел, делённая на их количество.',q:'Найди среднее арифметическое чисел 4, 8 и 12.',a:['8'],hint:['Сложи числа и раздели на 3.'],explain:'(4 + 8 + 12) / 3 = 8.'},
{subject:'Литература',topic:'Литературные термины',lesson:'Сравнение — сопоставление двух предметов или явлений по общему признаку.',q:'Как называется художественный приём «белый как снег»?',a:['сравнение'],hint:['В выражении есть союз «как».'],explain:'Это сравнение.'}
]};
const KEY='my-tutor-v3';let stored={};try{stored=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};
// Сохраняем результаты предыдущей версии при первом запуске.
if(!localStorage.getItem(KEY)){try{const old=JSON.parse(localStorage.getItem('my-tutor-v2')||'{}');stored.results=old.results||{};stored.extra=old.extra||{};stored.profile=old.profile||'nika'}catch(e){}}
const state={profile:'nika',page:'home',index:0,subject:'Все предметы',attempts:0,hints:0,feedback:'',answerStatus:'',results:{},homeworks:[],extra:{},...stored};
if(!['nika','fedya','parent'].includes(state.profile))state.profile='nika';
function save(){try{localStorage.setItem(KEY,JSON.stringify({profile:state.profile,results:state.results,homeworks:state.homeworks,extra:state.extra}))}catch(e){alert('Не удалось сохранить данные в этом браузере.')}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function button(label,act,cls=''){return `<button type="button" class="${cls}" data-act="${esc(act)}">${esc(label)}</button>`}
function stats(id){const r=(state.results||{})[id]||[];return {total:r.length,correct:r.filter(x=>x.ok).length,hints:r.reduce((a,x)=>a+(x.hints||0),0),weak:[...new Set(r.filter(x=>!x.ok||x.hints>0).map(x=>x.topic))]}}
function questions(){return bank[state.profile].filter(x=>state.subject==='Все предметы'||x.subject===state.subject)}
function render(){document.getElementById('profiles').innerHTML=[['nika','👩🏻‍🎓 Ника'],['fedya','👨🏼‍🎓 Федя'],['parent','👩‍👧‍👦 Родитель']].map(([id,label])=>button(label,'profile:'+id,state.profile===id?'active':'')).join('');let html='';if(state.profile==='parent')html=parent();else{const p=students[state.profile],s=stats(state.profile);html=`<div class="card"><h2>${p.icon} ${p.name} · ${p.grade}</h2><span class="pill">15–30 минут</span><span class="pill">Объяснение + практика</span><span class="pill">Без оплаты</span><div class="tabs" style="margin-top:14px">${[['home','Главная'],['practice','Практика'],['books','Учебники'],['homework','Домашнее задание']].map(([k,v])=>button(v,'page:'+k,state.page===k?'active':'')).join('')}</div></div>`;if(state.page==='home')html+=`<div class="grid"><div class="card"><h2>Сегодняшнее занятие</h2><p>Выбери предмет, прочитай объяснение и реши задания.</p>${button('Начать практику','page:practice','primary')}</div><div class="card"><h2>Мой прогресс</h2><div class="big">${s.total}</div><div class="muted">решённых заданий</div><p>Верных с первой попытки: ${s.correct}</p><p>Темы для повторения: ${s.weak.length?s.weak.map(esc).join(', '):'пока не определены'}</p></div></div>`;if(state.page==='practice')html+=practice();if(state.page==='books')html+=books();if(state.page==='homework')html+=homework()}document.getElementById('main').innerHTML=html;document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.act)));}
function practice(){const subjects=['Все предметы',...new Set(bank[state.profile].map(x=>x.subject))];const list=questions(),q=list[state.index%list.length];return `<section class="card"><h2>Практика по предметам</h2><label for="chooseSubject">Выбери предмет</label><select id="chooseSubject">${subjects.map(x=>`<option ${state.subject===x?'selected':''}>${esc(x)}</option>`).join('')}</select><p class="muted small">Авторские тренировочные задания. Это не дословные упражнения из PDF-учебников.</p><div class="muted">Задание ${state.index%list.length+1} из ${list.length} · ${esc(q.subject)}</div><h2>${esc(q.topic)}</h2><div class="lesson"><b>Объяснение</b><p>${esc(q.lesson)}</p></div><div class="question">${esc(q.q)}</div><label for="answer">Твой ответ</label><input id="answer" class="${state.answerStatus==='correct'?'answer-correct':state.answerStatus==='wrong'?'answer-wrong':''}" autocomplete="off" placeholder="Напиши ответ"><div class="row" style="margin-top:12px">${button('Проверить','check','primary')}${button('Подсказка','hint')}${button('Показать разбор','explain','secondary')}${button('Следующее','next')}</div><div class="feedback ${state.answerStatus}" aria-live="polite">${esc(state.feedback||'Реши самостоятельно. Если сложно, воспользуйся подсказкой.')}</div></section>`}
function books(){const p=students[state.profile],extras=(state.extra||{})[state.profile]||[];return `<section class="card"><h2>📚 Учебники: ${p.name}</h2><p class="muted">Перечень соответствует полученным учебникам. PDF-файлы хранятся в проекте ChatGPT, но ещё не опубликованы на сайте. Ссылки появятся после отдельного размещения материалов с учётом прав правообладателей.</p>${[...catalog[state.profile],...extras].map(([a,b])=>`<div class="book"><b>${esc(a)}</b><div class="muted small">${esc(b)}</div></div>`).join('')}<h3>Добавить запись об учебнике</h3><label for="newSubject">Предмет</label><input id="newSubject" placeholder="Предмет"><label for="newBook">Название или автор</label><input id="newBook" placeholder="Название, автор, год">${button('Добавить','addbook','primary')}</section>`}
function homework(){const arr=(state.homeworks||[]).filter(x=>x.profile===state.profile);return `<section class="card"><h2>📝 Домашнее задание</h2><p>Запиши задание — оно сохранится на этом устройстве. Можно отмечать выполненное.</p><label for="hwsubject">Предмет</label><select id="hwsubject">${[...new Set(catalog[state.profile].map(x=>x[0]))].map(x=>`<option>${esc(x)}</option>`).join('')}</select><label for="hwtext">Текст задания</label><textarea id="hwtext" rows="3" placeholder="Например: § 12, упражнение 45. Укажи условие, если нужен разбор."></textarea>${button('Сохранить задание','savehw','primary')}<h3>Мои задания (${arr.length})</h3>${arr.length?arr.map(x=>`<div class="hwitem"><b>${esc(x.subject)}</b> <span class="pill">${x.done?'Выполнено':'В работе'}</span><p style="white-space:pre-wrap">${esc(x.text)}</p><div class="row">${button(x.done?'Вернуть в работу':'Отметить выполненным','togglehw:'+x.id,'smallbtn')}${button('Удалить','delhw:'+x.id,'smallbtn')}</div></div>`).join(''):'<p class="muted">Пока заданий нет.</p>'}<div class="notice small">Автоматическое распознавание фотографий и свободный диалог с ИИ ещё не подключены. Сайт работает без платных API и без отправки заданий на сервер.</div></section>`}
function parent(){return `<div class="card"><h2>👩‍👧‍👦 Родительский кабинет</h2><div class="grid">${['nika','fedya'].map(id=>{const p=students[id],s=stats(id),hw=(state.homeworks||[]).filter(x=>x.profile===id);return `<div class="stat"><h3>${p.icon} ${p.name} · ${p.grade}</h3><div class="big">${s.total}</div><div>Проверок заданий</div><p>Верно с первой попытки: ${s.correct}</p><p>Использовано подсказок: ${s.hints}</p><p>Домашних заданий: ${hw.length}, выполнено: ${hw.filter(x=>x.done).length}</p><p>Повторить: ${s.weak.length?s.weak.map(esc).join(', '):'нет данных'}</p></div>`}).join('')}</div><div class="warn small">Данные сохраняются только в браузере этого устройства. На другом телефоне прогресс не появится автоматически. Это не защищённый паролем кабинет.</div>${button('Скачать данные прогресса','export','secondary')}</div>`}
function resetQuestion(){state.index=0;state.hints=0;state.attempts=0;state.feedback='';state.answerStatus='';state.recorded=false}
function record(q,ok){state.results=state.results||{};(state.results[state.profile]=state.results[state.profile]||[]).push({subject:q.subject,topic:q.topic,ok,hints:state.hints,date:new Date().toISOString()})}
function action(act){if(act.startsWith('profile:')){state.profile=act.slice(8);state.page='home';state.subject='Все предметы';resetQuestion()}else if(act.startsWith('page:')){state.page=act.slice(5);resetQuestion()}else if(act==='next'){state.index++;state.hints=0;state.attempts=0;state.feedback='';state.answerStatus='';state.recorded=false}else if(['hint','check','explain'].includes(act)){const list=questions(),q=list[state.index%list.length];if(act==='hint'){state.feedback=q.hint[Math.min(state.hints,q.hint.length-1)];state.hints++}else if(act==='explain'){state.feedback=q.explain}else{const raw=document.getElementById('answer').value.trim(),v=raw.toLocaleLowerCase('ru').replace(',','.').replace(/\s+/g,' ');if(!v){state.feedback='Сначала введи ответ.';state.answerStatus=''}else{const correct=q.a.some(a=>a.toLocaleLowerCase('ru')===v);if(!state.recorded){record(q,correct&&state.attempts===0);state.recorded=true}state.attempts++;state.answerStatus=correct?'correct':'wrong';state.feedback=correct?'Верно! '+q.explain:'Пока неверно. Попробуй ещё раз или возьми подсказку.'}}}else if(act==='savehw'){const text=document.getElementById('hwtext').value.trim(),subject=document.getElementById('hwsubject').value;if(!text){alert('Введи текст задания.');return}state.homeworks=state.homeworks||[];state.homeworks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),profile:state.profile,subject,text,done:false,date:new Date().toISOString()})}else if(act.startsWith('togglehw:')){const x=(state.homeworks||[]).find(x=>x.id===act.slice(9));if(x)x.done=!x.done}else if(act.startsWith('delhw:')){state.homeworks=(state.homeworks||[]).filter(x=>x.id!==act.slice(6))}else if(act==='addbook'){const a=document.getElementById('newSubject').value.trim(),b=document.getElementById('newBook').value.trim();if(!a||!b){alert('Заполни оба поля.');return}state.extra=state.extra||{};(state.extra[state.profile]=state.extra[state.profile]||[]).push([a,b])}else if(act==='export'){const data=JSON.stringify({exportedAt:new Date().toISOString(),results:state.results,homeworks:state.homeworks},null,2);const blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='moi-ii-repetitor-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}save();render()}
document.addEventListener('change',e=>{if(e.target.id==='chooseSubject'){state.subject=e.target.value;resetQuestion();render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();action('check')}});
render();
</script></body></html>
