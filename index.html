<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой ИИ-репетитор</title><style>:root{font-family:system-ui,-apple-system,Arial;background:#f5f6fb;color:#20243a}*{box-sizing:border-box}body{margin:0}.app{max-width:920px;margin:auto;padding:18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:24px;margin:12px 0}h2{font-size:20px}.muted{color:#667085}.card{background:white;border:1px solid #e5e8f0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #2221}.tabs,.row{display:flex;gap:9px;flex-wrap:wrap}button,select,input,textarea{font:inherit;border:1px solid #d9ddeb;border-radius:12px;padding:11px;background:white;color:#20243a}button{cursor:pointer}button.primary,.active{background:#525bd6;color:white;border-color:#525bd6}button:disabled{opacity:.5}input,textarea,select{max-width:100%;width:100%}label{display:block;margin:10px 0 5px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{padding:15px;border-radius:14px;background:#f4f5fc}.big{font-size:30px;font-weight:800}.hidden{display:none}.question{font-size:23px;font-weight:700;margin:18px 0}.pill{display:inline-block;padding:5px 10px;border-radius:20px;background:#edf0ff;color:#414ab2;margin:3px;font-size:13px}.feedback{padding:12px;background:#f4f5fc;border-radius:12px;margin:12px 0;min-height:45px}.book{padding:10px 0;border-bottom:1px solid #eee}.small{font-size:13px}.profile{font-size:28px}nav{margin:18px 0}.warn{background:#fff5e6;padding:12px;border-radius:12px}@media(max-width:560px){.app{padding:12px}.card{padding:15px}button{padding:10px}h1{font-size:21px}}</style></head><body><main class="app"><header><div><h1>📚 Мой ИИ-репетитор</h1><div class="muted small">Учимся по школьной программе — без лишних игровых сюжетов</div></div><span class="pill">Демо MVP 2.0</span></header><nav class="tabs" id="profiles"></nav><div id="main"></div></main><script>
const initial={nika:{name:'Ника',grade:'8 «Д»',icon:'👩🏻‍🎓',books:[['Алгебра','Под ред. С. А. Теляковского, 2024'],['Физика','И. М. Перышкин, А. И. Иванов, 2024'],['Литература','Коровина, Журавлёв, Коровин, ч. 1, 2026'],['Русский язык','8 класс, Просвещение, 2026'],['Английский язык','Spotlight 8, 2026']]},fedya:{name:'Федя',grade:'7 «Д»',icon:'👨🏼‍🎓',books:[['Алгебра','Под ред. С. А. Теляковского, 2025'],['Геометрия','7–9 классы, 2023'],['Вероятность и статистика','Высоцкий, Ященко, части 1 и 2'],['Литература','Коровина, Журавлёв, Коровин, ч. 2, 2025'],['Русский язык','7 класс, части 1 и 2, 2025'],['Биология','Под ред. В. В. Пасечника, 2025'],['История России','Мединский, Торкунов, 2025'],['Физика','Лабораторные и контрольные работы, 7 класс'],['Физика: задачи','Лукашик, Иванова, 7–9 классы']]}};
const bank={nika:[{subject:'Алгебра',topic:'Линейные уравнения',q:'Реши уравнение: 3x + 5 = 20',a:['5'],h:['Вычти 5 из обеих частей уравнения.','Теперь раздели обе части на 3.']},{subject:'Алгебра',topic:'Квадратные корни',q:'Чему равен √81?',a:['9'],h:['Какое положительное число при умножении на себя даёт 81?','Вспомни: 9 × 9 = 81.']},{subject:'Физика',topic:'Сила и давление',q:'Сила 100 Н действует на площадь 2 м². Найди давление в паскалях.',a:['50'],h:['Используй формулу p = F / S.','Раздели 100 на 2.']}],fedya:[{subject:'Геометрия',topic:'Углы',q:'Один из смежных углов равен 65°. Чему равен второй угол?',a:['115'],h:['Сумма смежных углов равна 180°.','Вычти 65 из 180.']},{subject:'Алгебра',topic:'Уравнения',q:'Реши уравнение: x + 7 = 19',a:['12'],h:['Какое действие обратно сложению?','Вычти 7 из 19.']},{subject:'Русский язык',topic:'Части речи',q:'Какая часть речи слово «быстро» в предложении «Он быстро бежал»?',a:['наречие'],h:['Слово отвечает на вопрос «как?».','Это неизменяемая часть речи, обозначающая признак действия.']}]} ;
const KEY='my-tutor-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};const state={profile:'nika',page:'home',index:0,hints:0,attempts:0,feedback:'',...saved};state.profile=['nika','fedya','parent'].includes(state.profile)?state.profile:'nika';function persist(){localStorage.setItem(KEY,JSON.stringify({profile:state.profile,results:state.results||{},extra:state.extra||{}}))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stats(id){const r=(state.results||{})[id]||[];return {total:r.length,correct:r.filter(x=>x.ok).length,hints:r.reduce((a,x)=>a+x.hints,0),weak:[...new Set(r.filter(x=>!x.ok||x.hints>0).map(x=>x.topic))]}}function btn(text,act,cls=''){return `<button class="${cls}" data-act="${act}">${text}</button>`}function render(){document.getElementById('profiles').innerHTML=[['nika','👩🏻‍🎓 Ника'],['fedya','👨🏼‍🎓 Федя'],['parent','👩‍👧‍👦 Родитель']].map(([id,label])=>btn(label,'profile:'+id,state.profile===id?'active':'')).join('');let html='';if(state.profile==='parent'){html=parent()}else{const p=initial[state.profile];const s=stats(state.profile);html=`<div class="card"><h2>${p.icon} ${p.name} · ${p.grade}</h2><span class="pill">30 минут</span><span class="pill">5 занятий в неделю</span><span class="pill">Школьная программа + повторение</span><div class="tabs" style="margin-top:14px">${btn('Главная','page:home',state.page==='home'?'active':'')}${btn('Практика','page:practice',state.page==='practice'?'active':'')}${btn('Учебники','page:books',state.page==='books'?'active':'')}${btn('Домашнее задание','page:homework',state.page==='homework'?'active':'')}</div></div>`;if(state.page==='home')html+=`<div class="grid"><div class="card"><h2>Сегодняшняя практика</h2><p>Школьные задания и повторение базовых тем.</p>${btn('Начать занятие','page:practice','primary')}</div><div class="card"><h2>Мой прогресс</h2><div class="big">${s.total}</div><div class="muted">выполнено заданий</div><p>Верных с первой попытки: ${s.correct}</p><p>Темы для повторения: ${s.weak.length?s.weak.map(esc).join(', '):'пока не определены'}</p></div></div>`;if(state.page==='practice')html+=practice();if(state.page==='books')html+=books();if(state.page==='homework')html+=homework();}document.getElementById('main').innerHTML=html;document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act));}
function practice(){const list=bank[state.profile];const q=list[state.index%list.length];return `<section class="card"><div class="muted">Задание ${state.index%list.length+1} из ${list.length} · ${esc(q.subject)}</div><h2>${esc(q.topic)}</h2><div class="question">${esc(q.q)}</div><label for="answer">Твой ответ</label><input id="answer" placeholder="Напиши ответ" autocomplete="off"><div class="row" style="margin-top:12px">${btn('Проверить','check','primary')}${btn('Подсказка','hint')}${btn('Следующее','next')}</div><div class="feedback" aria-live="polite">${esc(state.feedback||'Попробуй решить самостоятельно. Если сложно — попроси подсказку.')}</div><div class="muted small">Демо-задания авторские, не копии упражнений из учебника.</div></section>`}
function books(){const id=state.profile,p=initial[id],extras=(state.extra||{})[id]||[];return `<div class="card"><h2>Мои школьные учебники</h2><p class="muted">Библиотека составлена по фотографиям обложек. Полные тексты и номера упражнений пока не загружены.</p>${[...p.books,...extras].map(([a,b])=>`<div class="book"><b>${esc(a)}</b><div class="muted small">${esc(b)}</div></div>`).join('')}<h3>Добавить учебник</h3><label>Предмет</label><input id="subject" placeholder="Например, География"><label>Автор, название, год</label><input id="bookname" placeholder="Например, авторы, 2026">${btn('Добавить в библиотеку','addbook','primary')}</div>`}
function homework(){return `<div class="card"><h2>Помощь с домашним заданием</h2><p>Укажи предмет и условие задачи. Репетитор поможет разобрать решение по шагам, не подменяя самостоятельную работу.</p><label>Предмет</label><input id="hwsubject" placeholder="Например, Алгебра"><label>Параграф и задание</label><textarea id="hwtext" rows="4" placeholder="Вставь условие задания или напиши номер и текст"></textarea>${btn('Сохранить задание','savehw','primary')}<div class="warn" style="margin-top:14px">В этой демоверсии нет подключения к ИИ и распознавания фото. Для точного разбора задания нужен его текст или фотография страницы в будущей версии.</div><div id="hwout"></div></div>`}
function parent(){return `<div class="card"><h2>Родительский кабинет</h2><p class="muted">Локальная демонстрация. Для реального доступа родителей нужна авторизация.</p><div class="grid">${['nika','fedya'].map(id=>{const p=initial[id],s=stats(id);return `<div class="stat"><h3>${p.icon} ${p.name} · ${p.grade}</h3><div class="big">${s.total}</div><div>Заданий выполнено</div><p>Правильных с первой попытки: ${s.correct}</p><p>Подсказок использовано: ${s.hints}</p><p>Повторить: ${s.weak.length?s.weak.map(esc).join(', '):'нет данных'}</p></div>`}).join('')}</div><p class="small muted">Рекомендации будут уточняться по результатам большего числа заданий. Данные хранятся только в браузере этого устройства.</p></div>`}
function action(act){if(act.startsWith('profile:')){state.profile=act.split(':')[1];state.page='home';state.feedback=''}else if(act.startsWith('page:')){state.page=act.split(':')[1];state.feedback=''}else if(act==='hint'){const q=bank[state.profile][state.index%bank[state.profile].length];state.feedback=q.h[Math.min(state.hints,q.h.length-1)];state.hints++}else if(act==='check'){const q=bank[state.profile][state.index%bank[state.profile].length];const v=document.getElementById('answer').value.trim().toLowerCase().replace(',','.');if(!v){state.feedback='Сначала введи ответ.'}else if(q.a.includes(v)){state.feedback='Верно! Отлично. Объясни себе, почему это решение работает.';record(q,state.attempts===0);state.attempts++}else{state.attempts++;state.feedback=state.attempts===1?'Пока не получилось. Подумай ещё или возьми подсказку.':'Попробуй использовать подсказку и проверь вычисления.'}}else if(act==='next'){state.index++;state.hints=0;state.attempts=0;state.feedback=''}else if(act==='addbook'){const a=document.getElementById('subject').value.trim(),b=document.getElementById('bookname').value.trim();if(a&&b){state.extra=state.extra||{};(state.extra[state.profile]=state.extra[state.profile]||[]).push([a,b])}}else if(act==='savehw'){const t=document.getElementById('hwtext').value.trim(),s=document.getElementById('hwsubject').value.trim();if(t&&s){document.getElementById('hwout').textContent='Задание записано для текущей сессии: '+s+' — '+t;return}}persist();render()}
function record(q,ok){state.results=state.results||{};(state.results[state.profile]=state.results[state.profile]||[]).push({subject:q.subject,topic:q.topic,ok,hints:state.hints,date:new Date().toISOString()})}render();</script></body></html>
